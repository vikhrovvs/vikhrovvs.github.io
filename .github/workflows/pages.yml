name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Restore private ladder source and build graph
        env:
          LADDER_SOURCE_1: ${{ secrets.LADDER_SOURCE_1 }}
          LADDER_SOURCE_2: ${{ secrets.LADDER_SOURCE_2 }}
          LADDER_SOURCE_3: ${{ secrets.LADDER_SOURCE_3 }}
        run: |
          python3 scripts/ladder-source.py restore
          node scripts/build-ladder-graph.mjs
      - name: Update topology-dependent coordinates
        run: |
          python3 -m pip install -r scripts/requirements-ladder.txt
          python3 scripts/optimize-gentle-layout.py --if-needed
      - name: Validate static site
        run: |
          python3 scripts/check_site.py
          python3 scripts/test_word_grid.py
          node scripts/test-ladder-history.mjs
          node scripts/test-ladder-archive.mjs
          node scripts/test-ladder-paths.mjs
          node scripts/test-ladder-layout.mjs
          node scripts/test-gentle-layout.mjs
          node --check site/anagrams/app.js
          node --check site/word-route/app.js
          node --check site/word-grid/app.js
          node --check site/word-grid/worker.js
          node --check site/ladder-graph/history.js
          node --check site/ladder-graph/app.js
          node --check site/ladder-graph/layout.js
          node --check site/ladder-graph/gentle-layout.js
      - name: Remove private source from runner
        if: always()
        run: rm -f data/ladder-graph/archive.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
